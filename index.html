<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Begum Sahiba ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
font-family:Georgia,serif;
background:#190c27;
color:white;
text-align:center;
overflow-x:hidden;
}
section{
min-height:100vh;
padding:75px 20px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
position:relative;
}
.hero{
background:linear-gradient(135deg,#190c27,#76234e,#b53e72);
}
h1{font-size:40px;color:#ffd2e5;margin:20px}
h2{color:#ffb9d5;font-size:30px;margin:20px}
p{
font-size:18px;
line-height:1.9;
max-width:650px;
color:#ffe5ef;
}
.date{letter-spacing:5px;color:#ffcfdf}
.big{
font-size:75px;
margin:25px;
animation:glow 2s infinite alternate;
}
@keyframes glow{
to{transform:scale(1.12);text-shadow:0 0 35px pink}
}
.btn{
background:linear-gradient(45deg,#ff4e91,#ffb36b);
padding:15px 30px;
border:0;
border-radius:40px;
color:white;
font-size:17px;
margin:25px;
cursor:pointer;
}
.card{
background:#ffffff12;
border:1px solid #ffffff35;
border-radius:25px;
padding:30px;
max-width:650px;
width:100%;
margin:20px auto;
box-shadow:0 5px 30px #0003;
}
.pink{background:linear-gradient(135deg,#491b47,#9d3268)}
.purple{background:linear-gradient(135deg,#21133e,#63316e)}
.rose{background:linear-gradient(135deg,#75264b,#c24e77)}
.white{background:linear-gradient(135deg,#381b39,#71375e)
