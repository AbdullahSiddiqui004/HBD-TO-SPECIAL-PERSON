<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Special Person ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
font-family:Georgia,serif;
background:#160b25;
color:white;
text-align:center;
overflow-x:hidden;
}
section{
min-height:100vh;
padding:75px 20px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}
.hero{background:linear-gradient(135deg,#160b25,#72234f,#c34e80)}
.pink{background:linear-gradient(135deg,#4b173e,#a82e6c)}
.purple{background:linear-gradient(135deg,#211238,#69356f)}
.rose{background:linear-gradient(135deg,#79294e,#ce6089)}
.dark{background:linear-gradient(135deg,#160b25,#382044)}
.gold{background:linear-gradient(135deg,#38202c,#8a5934)}
h1{font-size:40px;color:#ffdbb0;margin:20px}
h2{font-size:29px;color:#ffc3dc;margin:20px}
p{font-size:18px;line-height:2;max-width:680px;color:#ffe6f0}
.card{
width:100%;
max-width:680px;
padding:30px 22px;
margin:25px auto;
border:1px solid #ffffff45;
border-radius:25px;
background:#ffffff13;
box-shadow:0 10px 35px #0003;
}
.big{font-size:75px;margin:20px;animation:glow 2s infinite alternate}
@keyframes glow{
to{transform:scale(1.12);text-shadow:0 0 35px pink}
}
.btn{
